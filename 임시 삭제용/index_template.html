<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduOS ARCHIVE | 학생 복습 노트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { background-color: #020617; color: #f8fafc; font-family: 'Pretendard', sans-serif; -webkit-font-smoothing: antialiased; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .accent-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tab-active { border-bottom: 3px solid #6366f1; color: #6366f1; font-weight: 900; }
        .viewer-content img { max-width: 100%; height: auto; border-radius: 16px; margin: 0 auto; }
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <header class="mb-12 text-center">
            <h1 class="text-5xl font-black mb-4 italic tracking-tighter accent-gradient">EduOS ARCHIVE</h1>
            <p class="text-slate-500 font-bold uppercase tracking-[0.4em] text-[10px]">SMART REVIEW SYSTEM</p>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-4">
                <h2 class="text-sm font-black text-indigo-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-layer-group"></i> Lesson Records
                </h2>
                <div id="list-container" class="space-y-3 max-h-[70vh] overflow-y-auto pr-2">
                    <div class="glass p-8 text-center text-slate-600 rounded-3xl font-bold">로딩 중...</div>
                </div>
            </div>

            <div id="viewer-container" class="lg:col-span-8 glass rounded-[40px] overflow-hidden hidden flex flex-col">
                <div class="flex border-b border-white/5 bg-white/5">
                    <button onclick="switchTab('problem')" id="tab-problem" class="flex-1 py-5 text-xs font-black uppercase tracking-widest transition-all hover:bg-white/5 tab-active">Problem</button>
                    <button onclick="switchTab('board')" id="tab-board" class="flex-1 py-5 text-xs font-black uppercase tracking-widest transition-all hover:bg-white/5">My Note</button>
                    <button onclick="switchTab('solution')" id="tab-solution" class="flex-1 py-5 text-xs font-black uppercase tracking-widest transition-all hover:bg-white/5">Solution</button>
                </div>

                <div class="p-8 flex-1 flex items-center justify-center min-h-[500px]">
                    <div id="content-problem" class="viewer-content w-full"></div>
                    <div id="content-board" class="viewer-content w-full hidden"></div>
                    <div id="content-solution" class="viewer-content w-full hidden bg-white text-slate-900 rounded-3xl overflow-hidden shadow-2xl">
                        <iframe id="sol-iframe" src="" width="100%" height="600px" frameborder="0"></iframe>
                    </div>
                </div>
            </div>

            <div id="empty-state" class="lg:col-span-8 glass rounded-[40px] flex flex-col items-center justify-center p-20 text-center">
                <i class="fa-solid fa-feather-pointed text-5xl text-slate-800 mb-8"></i>
                <h3 class="text-xl font-bold text-slate-400 italic">문제를 선택하면 복습이 시작됩니다.</h3>
                <p class="text-slate-600 mt-2 text-sm">선생님의 판서와 정석 해설을 한 번에 확인하세요.</p>
            </div>
        </main>
        
        <footer class="mt-20 text-center opacity-30 group hover:opacity-100 transition-opacity">
            <p class="text-slate-500 text-[10px] font-bold tracking-[0.5em] uppercase">
                Powered by Eduest Special OS
            </p>
        </footer>
    </div>

    <script>
        let archiveData = [];

        // 1. list.json 로드
        async function loadArchive() {
            try {
                const res = await fetch('list.json?t=' + Date.now());
                archiveData = await res.json();
                renderList();
            } catch (err) {
                document.getElementById('list-container').innerHTML = '<div class="glass p-8 text-rose-500 font-bold">데이터를 찾을 수 없습니다.</div>';
            }
        }

        // 2. 리스트 렌더링
        function renderList() {
            const container = document.getElementById('list-container');
            if (archiveData.length === 0) {
                container.innerHTML = '<div class="glass p-8 text-slate-500 font-bold italic">기록된 수업이 없습니다.</div>';
                return;
            }
            container.innerHTML = archiveData.map((item, idx) => `
                <div onclick="selectItem(${idx})" class="glass p-6 rounded-[24px] cursor-pointer hover:border-indigo-500/50 transition-all group relative overflow-hidden">
                    <div class="flex flex-col gap-1 relative z-10">
                        <span class="text-[10px] text-indigo-400 font-black uppercase tracking-widest">${new Date(item.date).toLocaleDateString()}</span>
                        <div class="font-bold text-slate-200 group-hover:text-white transition-colors">${item.name}</div>
                    </div>
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-white/5 group-hover:text-indigo-500/20 transition-colors">
                        <i class="fa-solid fa-chevron-right text-3xl"></i>
                    </div>
                </div>
            `).join('');
        }

        // 3. 아이템 선택
        function selectItem(idx) {
            const item = archiveData[idx];
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('viewer-container').classList.remove('hidden');

            // 🖼️ 이미지 & 해설 세팅 (구글 드라이브 ID 활용)
            // problemUrl과 id(판서)는 이미지이므로 uc?id= 사용
            document.getElementById('content-problem').innerHTML = `<img src="https://drive.google.com/uc?id=${item.problemUrl}" alt="Problem">`;
            document.getElementById('content-board').innerHTML = `<img src="https://drive.google.com/uc?id=${item.id}" alt="Board Note">`;
            
            // 📄 해설 HTML 로딩 (미리보기 모드로 iframe 삽입)
            if (item.solutionUrl) {
                document.getElementById('sol-iframe').src = `https://drive.google.com/file/d/${item.solutionUrl}/preview`;
            } else {
                document.getElementById('content-solution').innerHTML = '<div class="p-20 text-center font-bold text-slate-400 italic">제공된 해설이 없습니다.</div>';
            }

            switchTab('problem');
        }

        // 4. 탭 전환
        function switchTab(tab) {
            document.querySelectorAll('.viewer-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove('tab-active'));
            
            document.getElementById('content-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.add('tab-active');
        }

        loadArchive();
    </script>
</body>
</html>
